{% extends "base.html" %}
{% load socialaccount %}

{% block title %}Log In | Illini Rent Radar{% endblock %}

{% block content %}
<h2>Log In</h2>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Log in</button>

    <div class="d-grid">
    <a href="{% provider_login_url 'google' %}"
       class="google-btn text-decoration-none text-center">
       <img src="https://developers.google.com/identity/images/g-logo.png"
            alt="Google Logo"
            class="google-icon">
       Sign in with Google
    </a>
  </div>


</form>
<p>New to Illini Rent Radar? <a href="{% url 'register' %}">Create an account</a>.</p>
{% endblock %}
