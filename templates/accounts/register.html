{% extends "base.html" %}
{% load socialaccount %}

{% block title %}Create Account | Illini Rent Radar{% endblock %}

{% block content %}
<h2>Create an Account</h2>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Create account</button>



    <!-- ================================ -->
    <!-- GOOGLE SIGNUP (OAUTH)            -->
    <!-- ================================ -->

    <div class="d-grid">
      <a href="{% provider_login_url 'google' %}"
         class="google-btn text-decoration-none text-center">
         <img src="https://developers.google.com/identity/images/g-logo.png"
              alt="Google Logo"
              class="google-icon">
         Continue with Google
      </a>
    </div>

</form>
<p>Already have an account? <a href="{% url 'login' %}">Log in</a>.</p>
{% endblock %}
