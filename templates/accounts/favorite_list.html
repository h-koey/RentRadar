{% extends "base.html" %}

{% block title %}Favorites | Illini Rent Radar{% endblock %}

{% block content %}
<h2 style="text-align:center;">Favorite apartments</h2>
{% for favorite in favorites %}
    <p><a href="{% url 'apartment_detail' favorite.apartment.id %}">{{ favorite.apartment.name }}</a></p>
{% empty %}
    <p style="text-align:center;">You have no favorite apartments yet.</p>
{% endfor %}
{% endblock %}
